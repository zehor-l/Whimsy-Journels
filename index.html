<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✦ Whimsy Journals ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Nunito:wght@300;400;600&family=Satisfy&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAiA-XsZjatWcrGJ2MZNJzLmsnFW8AD_g",
    authDomain: "whimsyjournels.firebaseapp.com",
    projectId: "whimsyjournels",
    storageBucket: "whimsyjournels.firebasestorage.app",
    messagingSenderId: "808043276261",
    appId: "1:808043276261:web:489f7adf3055c75ec9310c",
    measurementId: "G-54WJQ7RTKZ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // Expose simple functions on window so the plain (non-module) React script below can use them
  window.fbSignIn = () => signInWithPopup(auth, provider).then(result => {
    const u = result.user;
    return { name: u.displayName, email: u.email, picture: u.photoURL, uid: u.uid };
  });
  window.fbSignOut = () => signOut(auth);
  window.fbOnAuthChanged = (callback) => onAuthStateChanged(auth, (firebaseUser) => {
    if (firebaseUser) {
      callback({ name: firebaseUser.displayName, email: firebaseUser.email, picture: firebaseUser.photoURL, uid: firebaseUser.uid });
    } else {
      callback(null);
    }
  });

  // Cloud data sync (Firestore) -- one document per signed-in user, keyed by uid.
  // This is what makes journal/places/etc. follow the account across devices,
  // instead of being trapped in one browser's localStorage.
  window.fbLoadAll = (uid) => {
    if (!uid) return Promise.resolve({});
    return getDoc(doc(db, "users", uid))
      .then(snap => (snap.exists() ? snap.data() : {}))
      .catch(err => { console.error("Firestore load failed:", err); return {}; });
  };
  window.fbSaveField = (uid, key, value) => {
    if (!uid) return Promise.resolve();
    return setDoc(doc(db, "users", uid), { [key]: value }, { merge: true })
      .catch(err => console.error("Firestore save failed:", err));
  };

  window.fbReady = true;
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Nunito',sans-serif;background:#f5ede0;}
#root{min-height:100vh;}

:root{
  --cream:#f5ede0;--parchment:#ede0c8;--blush:#d4a8a0;--rose:#b87060;
  --dusty-rose:#c49080;--sage:#7a9c78;--dark-sage:#4a6c48;
  --forest:#2c4830;--gold:#c8a050;--antique-gold:#a07838;
  --lavender:#9880b0;--mauve:#8a6070;--ink:#2a1a10;
  --soft:#6a5040;--warm-white:#faf4ec;--card:#fff8ef;
  --dark-brown:#3a1e0a;--velvet:#1e0e20;
}

@keyframes floatA{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(5deg)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes floatC{0%,100%{transform:translateY(0) translateX(0)}33%{transform:translateY(-18px) translateX(6px)}66%{transform:translateY(-8px) translateX(-5px)}}
@keyframes drift{0%{transform:translateX(-80px) translateY(0) rotate(0)}100%{transform:translateX(calc(100vw+100px)) translateY(-50px) rotate(20deg)}}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.7)}50%{opacity:1;transform:scale(1.3)}}
@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0)}30%{opacity:1;transform:scale(1.2) rotate(180deg)}60%{opacity:0.6;transform:scale(0.8) rotate(270deg)}100%{opacity:0;transform:scale(0) rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%,100%{opacity:0.1}50%{opacity:0.35}}
@keyframes toastIn{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes frameGlow{0%,100%{box-shadow:0 0 20px rgba(200,160,80,0.2),inset 0 0 20px rgba(200,160,80,0.05)}50%{box-shadow:0 0 40px rgba(200,160,80,0.4),inset 0 0 30px rgba(200,160,80,0.1)}}
@keyframes stampIn{from{transform:rotate(12deg) scale(0);opacity:0}to{transform:rotate(12deg) scale(1);opacity:1}}
@keyframes cloudDrift{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:4px;
  padding:10px 20px;flex-wrap:wrap;
  background:rgba(245,237,224,0.92);
  backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:2px solid rgba(200,160,80,0.4);
  box-shadow:0 2px 20px rgba(100,60,20,0.12);
  border-radius:0 0 22px 22px;
}
.nav-title{
  font-family:'Satisfy',cursive;font-size:18px;color:var(--rose);
  margin-right:12px;flex-shrink:0;
  text-shadow:1px 1px 0 rgba(255,255,255,0.8);
  letter-spacing:1px;
}
.nav-btn{
  border:none;background:transparent;cursor:pointer;
  font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;
  color:var(--soft);padding:6px 16px;border-radius:999px;transition:all 0.2s;
  border:1px solid transparent;letter-spacing:0.5px;
}
.nav-btn:hover{background:rgba(200,160,80,0.12);color:var(--ink);border-color:rgba(200,160,80,0.3);}
.nav-btn.active{
  background:linear-gradient(135deg,rgba(212,168,160,0.3),rgba(200,160,80,0.2));
  color:var(--dark-brown);font-weight:600;
  border:1px solid rgba(200,160,80,0.45);
  box-shadow:inset 0 1px 3px rgba(200,160,80,0.1);
}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

/* ── HERO ── */
.hero{text-align:center;padding:60px 24px 44px;position:relative;z-index:10;}
.hero-title{
  font-family:'Satisfy',cursive;
  font-size:clamp(48px,9vw,90px);
  color:var(--dark-brown);
  line-height:1.05;margin-bottom:10px;
  position:relative;display:inline-block;
  text-shadow:2px 3px 0 rgba(255,255,255,0.6),0 6px 20px rgba(100,60,20,0.15);
}
.hero-title-wrap{position:relative;display:inline-block;}
.hero-divider{
  width:200px;height:1px;margin:14px auto 16px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--antique-gold),var(--gold),transparent);
  position:relative;
}
.hero-divider::before,.hero-divider::after{
  content:'❧';position:absolute;top:-9px;color:var(--antique-gold);font-size:12px;opacity:0.7;
}
.hero-divider::before{left:-8px;}
.hero-divider::after{right:-8px;}
.hero-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;
  color:var(--soft);letter-spacing:3px;
}

/* ── SECTION ── */
.section{max-width:1020px;margin:0 auto;padding:32px 20px 70px;position:relative;z-index:10;}
.section-title{
  font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;
  color:var(--dark-brown);margin-bottom:28px;display:flex;align-items:center;gap:12px;
  letter-spacing:1px;border-bottom:1px solid rgba(200,160,80,0.3);padding-bottom:12px;
}
.section-title::before{content:'❧';color:var(--antique-gold);font-size:20px;}
.dark-page{color:#f0e8d8;}
.dark-page .section-title{color:#d8a8e8;border-bottom-color:rgba(180,120,210,0.3);}
.dark-page .section-title::before{color:#c888d8;}

/* ── CARD ── */
.card{
  background:rgba(255,248,239,0.94);
  border:1px solid rgba(200,160,80,0.2);
  border-radius:20px;
  box-shadow:0 4px 20px rgba(100,60,20,0.1),0 1px 3px rgba(0,0,0,0.05);
  padding:20px;position:relative;overflow:hidden;
  transition:transform 0.25s,box-shadow 0.25s;
  backdrop-filter:blur(4px);
}
.card-photo{width:calc(100% + 40px);margin:-20px -20px 14px;height:140px;object-fit:cover;display:block;border-radius:20px 20px 0 0;}
.card:hover{transform:translateY(-4px) rotate(0.3deg);box-shadow:0 12px 36px rgba(100,60,20,0.18);}

.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}

/* ── FORM ── */
.input{
  width:100%;border:1px solid rgba(180,130,80,0.35);
  border-radius:3px;padding:10px 14px;
  font-family:'Nunito',sans-serif;font-size:14px;
  color:var(--ink);background:rgba(255,250,240,0.9);
  outline:none;transition:border-color 0.2s,background 0.2s;
}
.input:focus{border-color:var(--antique-gold);background:#fff;box-shadow:0 0 0 3px rgba(200,160,80,0.12);}
.textarea{resize:vertical;min-height:80px;}
.btn{border:none;cursor:pointer;border-radius:3px;font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;padding:9px 22px;transition:all 0.2s;letter-spacing:0.5px;}
.btn-primary{background:linear-gradient(135deg,#b87060,#c8a050);color:#fff8ef;box-shadow:0 2px 10px rgba(120,60,30,0.25);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(120,60,30,0.38);}
.btn-sm{font-size:13px;padding:6px 15px;}
.btn-ghost{background:transparent;border:1px solid rgba(180,130,80,0.4);color:var(--soft);}
.btn-ghost:hover{background:rgba(200,160,80,0.1);color:var(--ink);}
.btn-icon{background:rgba(255,248,239,0.8);border:1px solid rgba(180,130,80,0.25);border-radius:3px;padding:4px 8px;cursor:pointer;font-size:14px;transition:all 0.15s;}
.btn-icon:hover{background:rgba(200,160,80,0.18);transform:scale(1.08);}

.form-box{
  background:rgba(255,250,240,0.6);
  border:1px dashed rgba(180,130,80,0.45);
  border-radius:6px;padding:24px;margin-bottom:30px;
  display:flex;flex-direction:column;gap:14px;
  backdrop-filter:blur(8px);position:relative;
}
.form-box::before{
  content:'';position:absolute;top:-6px;left:20px;width:50px;height:12px;
  background:rgba(220,200,160,0.55);transform:rotate(-1deg);border-radius:2px;
}
.form-row{display:flex;gap:10px;flex-wrap:wrap;}
.form-row .input{flex:1;min-width:140px;}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(20,10,5,0.6);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn 0.2s ease;
}
.modal{
  background:var(--warm-white);border-radius:6px;padding:30px;
  width:100%;max-width:480px;
  box-shadow:0 24px 64px rgba(0,0,0,0.3),0 0 0 2px rgba(200,160,80,0.4);
  animation:slideUp 0.28s cubic-bezier(0.175,0.885,0.32,1.275);
  position:relative;
}
.modal::before,.modal::after{content:'';position:absolute;width:20px;height:20px;border:1.5px solid var(--gold);}
.modal::before{top:6px;left:6px;border-right:none;border-bottom:none;}
.modal::after{bottom:6px;right:6px;border-left:none;border-top:none;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;color:var(--dark-brown);margin-bottom:20px;letter-spacing:1px;}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--soft);transition:transform 0.15s;}
.modal-close:hover{transform:scale(1.2) rotate(90deg);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ── POLAROID ── */
.polaroid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:32px;padding:8px 0;}
.polaroid{
  background:#faf4e8;padding:12px 12px 48px;border-radius:2px;
  box-shadow:0 8px 32px rgba(60,30,10,0.2),0 2px 8px rgba(0,0,0,0.08),inset 0 0 0 1px rgba(200,160,80,0.15);
  position:relative;transform:rotate(var(--rot));
  transition:transform 0.3s,box-shadow 0.3s;cursor:pointer;
  border:6px solid transparent;
  background-image:linear-gradient(#faf4e8,#faf4e8),linear-gradient(135deg,#c8a050,#e8d090,#a07838);
  background-origin:border-box;background-clip:padding-box,border-box;
}
.polaroid:hover{transform:rotate(0deg) scale(1.05) translateY(-6px);box-shadow:0 18px 48px rgba(60,30,10,0.28);}
.polaroid-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:1px;display:block;filter:saturate(0.85) sepia(0.08) contrast(1.05);}
.polaroid-placeholder{width:100%;aspect-ratio:1;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#ede0c8,#d4c4a8);}
.polaroid-caption{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:15px;color:#3a2418;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.polaroid-date{position:absolute;bottom:2px;right:14px;font-family:'Caveat',cursive;font-size:10px;color:#c0a080;}
.polaroid-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:5;opacity:0;transition:opacity 0.2s;}
.polaroid:hover .polaroid-actions{opacity:1;}

/* ── PLACES ── */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
.cat-tab{
  border:1px solid rgba(180,130,80,0.3);cursor:pointer;border-radius:999px;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;
  padding:7px 18px;transition:all 0.2s;background:rgba(255,248,239,0.6);color:var(--soft);
}
.cat-tab:hover,.cat-tab.active{color:var(--ink);transform:translateY(-1px);}
.cat-tab.active[data-cat="Art"]{background:linear-gradient(135deg,#e8c878,#d4a888);border-color:rgba(200,160,80,0.5);}
.cat-tab.active[data-cat="Food"]{background:linear-gradient(135deg,#b0c8a0,#90b088);border-color:rgba(80,120,60,0.4);}
.cat-tab.active[data-cat="Music"]{background:linear-gradient(135deg,#c0a0c8,#a888b8);border-color:rgba(120,80,140,0.4);}
.cat-tab.active[data-cat="Experiences"]{background:linear-gradient(135deg,#d4a0a8,#b88090);border-color:rgba(160,80,90,0.4);}
.cat-tab.active[data-cat="All"]{background:linear-gradient(135deg,var(--blush),var(--gold));border-color:rgba(200,160,80,0.5);}
.cat-tab-add{
  border:1px dashed rgba(180,130,80,0.5);cursor:pointer;border-radius:999px;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;
  padding:7px 16px;background:transparent;color:var(--antique-gold);transition:all 0.2s;
}
.cat-tab-add:hover{background:rgba(200,160,80,0.12);transform:translateY(-1px);}
.stamp-overlay{position:absolute;top:-12px;right:-8px;font-size:36px;transform:rotate(12deg);filter:drop-shadow(0 2px 5px rgba(0,0,0,0.15));animation:stampIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275);}
.cat-badge{display:inline-block;font-size:11px;font-family:'Cormorant Garamond',serif;padding:3px 12px;border-radius:999px;margin-bottom:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}

/* ── LIST ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
@media(max-width:600px){.two-col{grid-template-columns:1fr;}}
.list-panel{background:rgba(255,248,239,0.6);border-radius:4px;padding:22px;border:1px solid rgba(180,130,80,0.25);backdrop-filter:blur(6px);}
.list-panel-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;margin-bottom:16px;color:var(--dark-brown);}
.list-item{
  display:flex;align-items:flex-start;gap:10px;background:rgba(255,248,239,0.9);
  border:1px solid rgba(180,130,80,0.15);border-radius:3px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(100,60,20,0.07);transition:transform 0.15s;
}
.list-item:hover{transform:translateX(4px);}
.list-item-body{flex:1;}
.list-item-title{font-family:'Caveat',cursive;font-size:17px;color:var(--ink);}
.list-item-note{font-size:12px;color:var(--soft);margin-top:2px;}
.list-item-actions{display:flex;gap:5px;align-items:center;flex-shrink:0;}

/* ── STICKY ── */
.sticky-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;padding:8px 0;}
.sticky{
  border-radius:2px;padding:24px;position:relative;min-height:150px;
  box-shadow:3px 5px 18px rgba(0,0,0,0.12),inset 0 -1px 0 rgba(0,0,0,0.05);
  transform:rotate(var(--rot));transition:transform 0.22s,box-shadow 0.22s;
}
.sticky:hover{transform:rotate(0deg) scale(1.04);box-shadow:6px 10px 30px rgba(0,0,0,0.18);z-index:2;}
.sticky-title{font-family:'Caveat',cursive;font-size:19px;color:#2a1810;margin-bottom:8px;font-weight:700;}
.sticky-body{font-size:13px;color:#5a3828;line-height:1.6;}
.sticky-pin{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--pin-color) 100%);box-shadow:0 2px 6px rgba(0,0,0,0.3);}
.sticky-actions{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity 0.2s;}
.sticky:hover .sticky-actions{opacity:1;}

/* ── WISHLIST PAGE ── */
.scratch-header{text-align:center;padding:40px 20px 20px;position:relative;z-index:10;}
.scratch-title{
  font-family:'Caveat',cursive;font-size:clamp(36px,7vw,64px);color:var(--dark-brown);
  text-shadow:2px 2px 0 rgba(200,160,80,0.3);position:relative;display:inline-block;transform:rotate(-1deg);
}
.scratch-subtitle{font-family:'Caveat',cursive;font-size:18px;color:var(--soft);margin-top:8px;}
.tape{
  display:inline-block;background:rgba(230,210,170,0.6);padding:4px 20px;border-radius:2px;
  transform:rotate(-2deg);font-family:'Caveat',cursive;font-size:14px;color:var(--soft);
  box-shadow:1px 2px 6px rgba(0,0,0,0.08);position:relative;
}
.wish-form-area{max-width:760px;margin:0 auto;padding:0 20px;position:relative;z-index:10;}
.wish-input{
  flex:1;min-width:200px;border:none;border-bottom:2px solid rgba(180,130,80,0.4);
  border-radius:0;padding:8px 4px;font-family:'Caveat',cursive;font-size:18px;
  color:var(--ink);background:transparent;outline:none;transition:border-color 0.2s;
}
.wish-input:focus{border-bottom-color:var(--rose);}
.wish-input::placeholder{color:rgba(100,60,30,0.4);}
.wish-input-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.wish-color-picker{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.wish-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;}
.wish-color-swatch.active{border-color:var(--dark-brown);transform:scale(1.25);}
.wish-grid{max-width:1020px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px;position:relative;z-index:10;}
.wish-card{
  position:relative;transform:rotate(var(--rot));transition:transform 0.25s,box-shadow 0.25s;cursor:pointer;
  border-radius:3px;padding:22px 20px 50px;min-height:180px;
  box-shadow:3px 6px 20px rgba(0,0,0,0.14),inset 0 0 0 1px rgba(255,255,255,0.4);
}
.wish-card:hover{transform:rotate(0deg) scale(1.04) translateY(-4px);box-shadow:6px 14px 36px rgba(0,0,0,0.2);z-index:5;}
.wish-card::after{content:'';position:absolute;inset:6px;border:1.5px dashed rgba(0,0,0,0.1);border-radius:2px;pointer-events:none;}
.wish-card-tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-1deg);width:50px;height:14px;background:rgba(230,210,170,0.65);border-radius:2px;box-shadow:1px 1px 3px rgba(0,0,0,0.08);}
.wish-card-emoji{font-size:32px;margin-bottom:8px;display:block;}
.wish-card-title{font-family:'Caveat',cursive;font-size:20px;color:#1e1008;font-weight:700;margin-bottom:6px;line-height:1.3;}
.wish-card-note{font-family:'Caveat',cursive;font-size:14px;color:rgba(30,16,8,0.65);line-height:1.5;}
.wish-card-date{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:11px;color:rgba(30,16,8,0.4);}
.wish-card-done-stamp{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.15);border-radius:3px;font-size:40px;font-family:'Caveat',cursive;font-weight:700;
  color:rgba(0,100,60,0.25);transform:rotate(-15deg);border:3px solid rgba(0,100,60,0.18);
  letter-spacing:2px;pointer-events:none;
}
.wish-actions{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px;opacity:0;transition:opacity 0.2s;}
.wish-card:hover .wish-actions{opacity:1;}
.wish-countdown{text-align:center;margin:8px 0 28px;font-family:'Caveat',cursive;font-size:18px;color:var(--soft);position:relative;z-index:10;}
.wish-stats{display:flex;justify-content:center;gap:28px;margin-bottom:28px;position:relative;z-index:10;flex-wrap:wrap;}
.wish-stat{background:rgba(255,248,239,0.7);border:1px solid rgba(180,130,80,0.25);border-radius:4px;padding:12px 24px;text-align:center;font-family:'Caveat',cursive;}
.wish-stat-num{font-size:28px;font-weight:700;color:var(--dark-brown);display:block;}
.wish-stat-label{font-size:13px;color:var(--soft);}

/* ── EMPTY ── */
.empty{text-align:center;padding:52px 20px;color:var(--soft);}
.empty-icon{font-size:56px;margin-bottom:14px;}
.empty-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;}

/* ── USER / GOOGLE ── */
.user-chip{display:flex;align-items:center;gap:6px;background:rgba(255,248,239,0.8);border-radius:999px;padding:4px 14px 4px 6px;border:1px solid rgba(180,130,80,0.35);font-family:'Caveat',cursive;font-size:14px;color:var(--ink);}
.user-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;}
.google-btn{
  display:flex;align-items:center;gap:8px;background:rgba(255,248,239,0.9);border:1px solid rgba(180,130,80,0.4);
  border-radius:999px;padding:7px 16px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:15px;color:var(--ink);transition:all 0.2s;white-space:nowrap;
}
.google-btn:hover{background:rgba(200,160,80,0.15);border-color:var(--antique-gold);transform:translateY(-1px);}
.google-icon{width:16px;height:16px;}
.signin-banner{
  text-align:center;padding:10px 20px;
  background:linear-gradient(135deg,rgba(212,168,160,0.3),rgba(200,160,80,0.25));
  border-bottom:1px solid rgba(200,160,80,0.3);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  position:relative;z-index:10;letter-spacing:0.5px;
}

.flex{display:flex;}.gap-2{gap:8px;}.gap-3{gap:12px;}.mt-1{margin-top:4px;}.mt-2{margin-top:8px;}
label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--soft);}
select.input{cursor:pointer;}

/* ── MUSIC PLAYER ── */
.music-player{
  position:fixed;bottom:22px;left:22px;z-index:300;display:flex;align-items:center;gap:10px;
  background:rgba(245,237,224,0.92);backdrop-filter:blur(16px);
  border:1px solid rgba(200,160,80,0.45);border-radius:3px;padding:8px 16px 8px 10px;
  box-shadow:0 4px 20px rgba(100,60,20,0.18);transition:all 0.3s;
}
.music-player:hover{box-shadow:0 6px 28px rgba(100,60,20,0.28);}
.music-play-btn{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--dusty-rose),var(--antique-gold));
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.2s;
  flex-shrink:0;color:#fff;box-shadow:0 2px 8px rgba(120,60,30,0.3);
}
.music-play-btn:hover{transform:scale(1.12);}
.music-label{font-family:'Caveat',cursive;font-size:13px;color:var(--soft);white-space:nowrap;}
.music-vol{-webkit-appearance:none;width:60px;height:3px;border-radius:2px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--rose),var(--antique-gold));}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--antique-gold);cursor:pointer;}
.music-note{font-size:13px;animation:floatA 2.5s ease-in-out infinite;display:inline-block;}
.music-player.dark{background:rgba(20,10,5,0.92);border-color:rgba(200,160,80,0.4);}
.music-player.dark .music-label{color:rgba(240,228,200,0.7);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:linear-gradient(135deg,#b87060,#c8a050);color:#fff8ef;font-family:'Caveat',cursive;font-size:17px;
  padding:12px 22px;border-radius:3px;box-shadow:0 6px 24px rgba(100,60,20,0.25);
  animation:toastIn 0.3s ease;pointer-events:none;letter-spacing:0.5px;
}

const saveTimers={};
const save=(user,tab,data)=>{
  try{localStorage.setItem(storageKey(user,tab),JSON.stringify(data));}catch(e){}
  if(currentUid){
    const timerKey=storageKey(user,tab);
    clearTimeout(saveTimers[timerKey]);
    saveTimers[timerKey]=setTimeout(()=>{
      if(window.fbSaveField)window.fbSaveField(currentUid,tab,data);
    },500);
  }
};
const load=(user,tab,def)=>{try{const v=localStorage.getItem(storageKey(user,tab));return v?JSON.parse(v):def;}catch(e){return def;}};

function SparkleTitle(){
  const [sparks,setSparks]=useState([]);
  useEffect(()=>{
    const make=()=>{
      const id=uid();
      const x=Math.random()*100; const y=Math.random()*100;
      const size=4+Math.random()*6;
      setSparks(s=>[...s,{id,x,y,size}]);
      setTimeout(()=>setSparks(s=>s.filter(x=>x.id!==id)),2500);
    };
    make();
    const t=setInterval(make,600);
    return()=>clearInterval(t);
  },[]);
  return(
    <div className="hero-title-wrap">
      <div className="hero-title">Whimsy Journals</div>
      {sparks.map(s=>(
        <div key={s.id} style={{
          position:"absolute",left:`${s.x}%`,top:`${s.y}%`,
          width:s.size,height:s.size,
          background:"radial-gradient(circle,#c8a050,#f0d080,transparent)",
          borderRadius:"50%",animation:"sparkle 2.5s ease-in-out forwards",
          pointerEvents:"none",boxShadow:`0 0 ${s.size*2}px rgba(200,160,80,0.8)`,

      ))}
    </div>
  );
}

function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

function EditModal({fields,values,onChange,onSave,onClose}){
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">✦ edit entry</div>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {fields.map(f=>(
            <div key={f.key}>
              <label>{f.label}</label>
              {f.type==="textarea"
                ?<textarea className="input textarea" style={{marginTop:4}} value={values[f.key]||""} onChange={e=>onChange(f.key,e.target.value)}/>
                :f.type==="select"
                  ?<select className="input" style={{marginTop:4}} value={values[f.key]||""} onChange={e=>onChange(f.key,e.target.value)}>
                      {f.options.map(o=><option key={o}>{o}</option>)}
                    </select>
                  :<input className="input" style={{marginTop:4}} value={values[f.key]||""} onChange={e=>onChange(f.key,e.target.value)}/>
              }
            </div>
          ))}
        </div>
        <div className="modal-actions">
          <button className="btn btn-ghost btn-sm" onClick={onClose}>cancel</button>
          <button className="btn btn-primary btn-sm" onClick={onSave}>✦ save changes</button>
        </div>
      </div>
    </div>
  );
}

function JournalSection({user,toast}){
  const [entries,setEntries]=useState(()=>load(user,"journal",[]));
  const [caption,setCaption]=useState("");
  const [imgSrc,setImgSrc]=useState(null);
  const [emoji,setEmoji]=useState("🌸");
  const [editing,setEditing]=useState(null);
  const [editVals,setEditVals]=useState({});
  const fileRef=useRef();
  const EMOJIS=["🌸","🌻","✨","🍄","🌙","🦋","🎨","💫","🌿","🎠","🌺","🦚"];
  useEffect(()=>{save(user,"journal",entries);},[entries,user]);
  const onFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImgSrc(ev.target.result);r.readAsDataURL(f);};
  const add=()=>{
    if(!caption&&!imgSrc)return;
    setEntries([{id:uid(),caption,imgSrc,emoji,date:today()},...entries]);
    setCaption("");setImgSrc(null);if(fileRef.current)fileRef.current.value="";
    toast("memory added ✨");
  };
  const remove=id=>{setEntries(entries.filter(x=>x.id!==id));toast("removed 🌿");};
  const openEdit=e=>{setEditing(e.id);setEditVals({caption:e.caption,emoji:e.emoji});};
  const saveEdit=()=>{setEntries(entries.map(e=>e.id===editing?{...e,...editVals}:e));setEditing(null);toast("updated ✦");};
  return(
    <div className="section">
      <div className="section-title">Journal</div>
      <div className="form-box">
        <div className="form-row">
          <div style={{flex:1}}>
            <label>caption</label>
            <input className="input" style={{marginTop:5}} value={caption} onChange={e=>setCaption(e.target.value)} placeholder="write something dreamy..." onKeyDown={e=>e.key==="Enter"&&add()}/>
          </div>
          <div>
            <label>vibe</label>
            <div className="flex gap-2" style={{flexWrap:"wrap",marginTop:5,maxWidth:220}}>
              {EMOJIS.map(e=>(
                <button key={e} onClick={()=>setEmoji(e)} style={{fontSize:18,border:"none",cursor:"pointer",background:emoji===e?"rgba(200,160,80,0.2)":"transparent",borderRadius:4,padding:"2px 4px",transition:"all 0.15s",transform:emoji===e?"scale(1.2)":"scale(1)"}}>{e}</button>
              ))}
            </div>
          </div>
        </div>
        <div className="flex gap-2" style={{alignItems:"center"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>fileRef.current?.click()}>📎 add photo</button>
          {imgSrc&&<span style={{fontSize:12,color:"var(--soft)"}}>photo ready ✓</span>}
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFile}/>
        </div>
        <button className="btn btn-primary btn-sm" style={{alignSelf:"flex-end"}} onClick={add}>✦ add to album</button>
      </div>
      {entries.length===0
        ?<div className="empty"><div className="empty-icon">📷</div><div className="empty-text">your album is waiting for memories ~</div></div>
        :<div className="polaroid-grid">
            {entries.map((e,i)=>(
              <div key={e.id} className="polaroid" style={{"--rot":`${rot(i)}deg`}}>
                {e.imgSrc?<img className="polaroid-img" src={e.imgSrc} alt={e.caption}/>
                          :<div className="polaroid-placeholder">{e.emoji}</div>}
                <div className="polaroid-caption">{e.caption||e.emoji}</div>
                <div className="polaroid-date">{e.date}</div>
                <div className="polaroid-actions">
                  <button className="btn-icon" onClick={()=>openEdit(e)} title="edit">✏️</button>
                  <button className="btn-icon" onClick={()=>remove(e.id)} title="delete" style={{color:"#904030"}}>🗑</button>
                </div>
              </div>
            ))}
          </div>
      }
      {editing&&<EditModal fields={[{key:"caption",label:"caption",type:"text"},{key:"emoji",label:"vibe emoji",type:"text"}]} values={editVals} onChange={(k,v)=>setEditVals({...editVals,[k]:v})} onSave={saveEdit} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function PlacesSection({user,toast}){
  const DEFAULT_CATS=["Art","Food","Music","Experiences"];
  const [customCats,setCustomCats]=useState(()=>load(user,"places_cats",[]));
  const CATS=["All",...DEFAULT_CATS,...customCats.map(c=>c.name)];
  const [places,setPlaces]=useState(()=>load(user,"places",[]));
  const [name,setName]=useState("");const [note,setNote]=useState("");
  const [cat,setCat]=useState("Art");const [filter,setFilter]=useState("All");
  const [bunny,setBunny]=useState("🐰");
  const [imgSrc,setImgSrc]=useState(null);
  const fileRef=useRef();
  const onFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImgSrc(ev.target.result);r.readAsDataURL(f);};
  const [showNewCat,setShowNewCat]=useState(false);const [newCatName,setNewCatName]=useState("");
  const [editing,setEditing]=useState(null);const [editVals,setEditVals]=useState({});
  useEffect(()=>{save(user,"places",places);},[places,user]);
  useEffect(()=>{save(user,"places_cats",customCats);},[customCats,user]);
  const allCatNames=[...DEFAULT_CATS,...customCats.map(c=>c.name)];
  const customPalette=["linear-gradient(135deg,#a0c8d4,#80a8c0)","linear-gradient(135deg,#d4c0a0,#b89870)","linear-gradient(135deg,#c0d4a0,#a0b878)","linear-gradient(135deg,#d4a0c0,#b878a0)"];
  const getCatColor=c=>{
    if(catColors[c])return catColors[c];
    const cc=customCats.find(x=>x.name===c);
    const idx=cc?customCats.indexOf(cc):0;
    return {bg:customPalette[idx%customPalette.length],text:"#2a2018"};
  };
  const getCatEmoji=c=>catEmoji[c]||(customCats.find(x=>x.name===c)?.emoji)||"🏷️";
  const addCategory=()=>{
    const n=newCatName.trim();
    if(!n||allCatNames.includes(n))return;
    const emojis=["🏷️","🌟","🎈","🔖","🪄","🧭"];
    setCustomCats([...customCats,{name:n,emoji:emojis[customCats.length%emojis.length]}]);
    setCat(n);setNewCatName("");setShowNewCat(false);toast("category added ✨");
  };
  const add=()=>{if(!name)return;setPlaces([{id:uid(),name,note,cat,visited:false,imgSrc},...places]);setName("");setNote("");setImgSrc(null);if(fileRef.current)fileRef.current.value="";toast("place added 🗺️");};
  const stamp=id=>{setPlaces(places.map(p=>p.id===id?{...p,visited:!p.visited,bunnyStamp:bunny}:p));toast(places.find(p=>p.id===id)?.visited?"unstamped 🌿":"stamped "+bunny);};
  const remove=id=>{setPlaces(places.filter(p=>p.id!==id));toast("removed 🌿");};
  const openEdit=p=>{setEditing(p.id);setEditVals({name:p.name,note:p.note,cat:p.cat});};
  const saveEdit=()=>{setPlaces(places.map(p=>p.id===editing?{...p,...editVals}:p));setEditing(null);toast("updated ✦");};
  const visible=filter==="All"?places:places.filter(p=>p.cat===filter);
  return(
    <div className="section">
      <div className="section-title">Places to Explore</div>
      <div className="form-box">
        <div className="form-row">
          <input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="place name..." onKeyDown={e=>e.key==="Enter"&&add()}/>
          <select className="input" style={{maxWidth:170}} value={cat} onChange={e=>setCat(e.target.value)}>
            {allCatNames.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <input className="input" value={note} onChange={e=>setNote(e.target.value)} placeholder="a little note about it..."/>
        <div className="flex gap-2" style={{alignItems:"center",flexWrap:"wrap"}}>
          <label>stamp:</label>
          {BUNNIES.map(b=>(
            <button key={b} onClick={()=>setBunny(b)} style={{fontSize:16,border:"none",cursor:"pointer",background:bunny===b?"rgba(200,160,80,0.2)":"transparent",borderRadius:4,padding:"3px 6px",transition:"all 0.15s",transform:bunny===b?"scale(1.2)":"scale(1)"}}>{b}</button>
          ))}
        </div>
        <div className="flex gap-2" style={{alignItems:"center"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>fileRef.current?.click()}>📎 add photo</button>
          {imgSrc&&<span style={{fontSize:12,color:"var(--soft)"}}>photo ready ✓</span>}
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFile}/>
        </div>
        <button className="btn btn-primary btn-sm" style={{alignSelf:"flex-end"}} onClick={add}>✦ add place</button>
      </div>
      <div className="cat-tabs">
        {CATS.map(c=>(
          <button key={c} data-cat={DEFAULT_CATS.includes(c)||c==="All"?c:"All"} className={`cat-tab ${filter===c?"active":""}`} style={filter===c&&!DEFAULT_CATS.includes(c)&&c!=="All"?{background:getCatColor(c).bg}:{}} onClick={()=>setFilter(c)}>
            {c!=="All"?getCatEmoji(c):"🌍"} {c}
          </button>
        ))}
        {showNewCat
          ?<div className="flex gap-2" style={{alignItems:"center"}}>
              <input className="input" style={{width:140,padding:"6px 10px"}} autoFocus value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="new category..." onKeyDown={e=>e.key==="Enter"&&addCategory()}/>
              <button className="btn btn-primary btn-sm" onClick={addCategory}>add</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setShowNewCat(false);setNewCatName("");}}>✕</button>
            </div>
          :<button className="cat-tab-add" onClick={()=>setShowNewCat(true)}>+ new category</button>
        }
      </div>
      {visible.length===0
        ?<div className="empty"><div className="empty-icon">🗺️</div><div className="empty-text">no places yet — add an adventure!</div></div>
        :<div className="grid-3">
            {visible.map((p,i)=>(
              <div key={p.id} className="card" style={{opacity:p.visited?0.9:1}}>
                {p.visited&&<div className="stamp-overlay">{p.bunnyStamp||"🐰"}</div>}
                {p.imgSrc&&<img className="card-photo" src={p.imgSrc} alt={p.name}/>}
                <div style={{position:"absolute",top:12,right:12,display:"flex",gap:4,zIndex:5}}>
                  <button className="btn-icon" onClick={()=>openEdit(p)}>✏️</button>
                  <button className="btn-icon" onClick={()=>remove(p.id)} style={{color:"#904030"}}>🗑</button>
                </div>
                <div className="cat-badge" style={{background:getCatColor(p.cat).bg,color:getCatColor(p.cat).text}}>{getCatEmoji(p.cat)} {p.cat}</div>
                <div style={{fontFamily:"'Caveat',cursive",fontSize:20,color:"var(--ink)",marginBottom:4,paddingRight:60}}>{p.name}</div>
                {p.note&&<div style={{fontSize:13,color:"var(--soft)",marginBottom:12}}>{p.note}</div>}
                <button className={`btn btn-sm ${p.visited?"btn-ghost":"btn-primary"}`} style={{marginTop:8}} onClick={()=>stamp(p.id)}>
                  {p.visited?"✓ visited!":"🐰 stamp it"}
                </button>
              </div>
            ))}
          </div>
      }
      {editing&&<EditModal fields={[{key:"name",label:"place name"},{key:"cat",label:"category",type:"select",options:allCatNames},{key:"note",label:"note",type:"textarea"}]} values={editVals} onChange={(k,v)=>setEditVals({...editVals,[k]:v})} onSave={saveEdit} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function ListSection({icon,title,noun,accentColor,storeKey,user,toast}){
  const [watchList,setWatchList]=useState(()=>load(user,storeKey+"_w",[]));
  const [recList,setRecList]=useState(()=>load(user,storeKey+"_r",[]));
  const [input,setInput]=useState("");const [note,setNote]=useState("");

  const fileRef=useRef();

  const [editing,setEditing]=useState(null);const [editVals,setEditVals]=useState({});const [editList,setEditList]=useState("w");
  useEffect(()=>{save(user,storeKey+"_w",watchList);},[watchList,user]);
  useEffect(()=>{save(user,storeKey+"_r",recList);},[recList,user]);
  const addToWatch=()=>{if(!input)return;setWatchList([...watchList,{id:uid(),title:input,note,imgSrc}]);setInput("");setNote("");setImgSrc(null);if(fileRef.current)fileRef.current.value="";toast("added ✨");};
  const moveToRec=item=>{setWatchList(watchList.filter(x=>x.id!==item.id));setRecList([{...item},...recList]);toast("moved to recommend ⭐");};
  const removeW=id=>{setWatchList(watchList.filter(x=>x.id!==id));toast("removed 🌿");};
  const removeR=id=>{setRecList(recList.filter(x=>x.id!==id));toast("removed 🌿");};
  const openEditW=item=>{setEditList("w");setEditing(item.id);setEditVals({title:item.title,note:item.note||""});};
  const openEditR=item=>{setEditList("r");setEditing(item.id);setEditVals({title:item.title,note:item.note||""});};
  const saveEdit=()=>{
    if(editList==="w")setWatchList(watchList.map(x=>x.id===editing?{...x,...editVals}:x));
    else setRecList(recList.map(x=>x.id===editing?{...x,...editVals}:x));

class AmbientMusic{
  constructor(){this.ctx=null;this.masterGain=null;this.playing=false;this.timers=[];this.nodes=[];}
  _init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.masterGain=this.ctx.createGain();
    this.masterGain.gain.setValueAtTime(0,this.ctx.currentTime);
    const conv=this.ctx.createConvolver();
    const len=this.ctx.sampleRate*4;
    const buf=this.ctx.createBuffer(2,len,this.ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    conv.buffer=buf;
    const wet=this.ctx.createGain();wet.gain.value=0.5;
    const dry=this.ctx.createGain();dry.gain.value=0.6;
    this.masterGain.connect(dry);dry.connect(this.ctx.destination);
    this.masterGain.connect(conv);conv.connect(wet);wet.connect(this.ctx.destination);
    this.nodes.push(conv,wet,dry);
  }
  _chord(time,freqs,dur,vol=0.055){
    freqs.forEach((f,i)=>{
      const osc=this.ctx.createOscillator();const g=this.ctx.createGain();
      osc.type='sine';osc.frequency.value=f;
      g.gain.setValueAtTime(0,time);
      g.gain.linearRampToValueAtTime(vol*(1-i*0.07),time+1.4);
      g.gain.setValueAtTime(vol*(1-i*0.07),time+dur-1.5);
      g.gain.linearRampToValueAtTime(0,time+dur);
      osc.connect(g);g.connect(this.masterGain);osc.start(time);osc.stop(time+dur);
      this.nodes.push(osc,g);
    });
  }
  _chime(time,freq,vol=0.075){
    const osc=this.ctx.createOscillator();const osc2=this.ctx.createOscillator();const g=this.ctx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    osc2.type='sine';osc2.frequency.value=freq*2.756;
    const g2=this.ctx.createGain();g2.gain.value=0.28;
    g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(vol,time+0.01);g.gain.exponentialRampToValueAtTime(0.001,time+3.2);
    osc.connect(g);osc2.connect(g2);g2.connect(g);g.connect(this.masterGain);
    osc.start(time);osc.stop(time+3.5);osc2.start(time);osc2.stop(time+3.5);
    this.nodes.push(osc,osc2,g,g2);
  }
  _breath(time,freq,dur){
    const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const filt=this.ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=freq;filt.Q.value=10;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(0.016,time+dur*0.3);g.gain.linearRampToValueAtTime(0,time+dur);
    src.connect(filt);filt.connect(g);g.connect(this.masterGain);src.start(time);src.stop(time+dur);
    this.nodes.push(src,filt,g);
  }
  _schedule(){
    if(!this.playing)return;
    const t=this.ctx.currentTime;
    const progs=[
      [261.63,329.63,392.00,523.25],[293.66,369.99,440.00,587.33],
      [392.00,493.88,587.33,783.99],[349.23,440.00,523.25,698.46],[329.63,415.30,493.88,659.25],
    ];
    const prog=progs[Math.floor(Math.random()*progs.length)];
    this._chord(t,prog,15,0.05);
    const chimes=[523.25,587.33,659.25,783.99,880.00,1046.5,698.46,784.00];
    const n=3+Math.floor(Math.random()*5);
    for(let i=0;i<n;i++){const delay=1+Math.random()*12;const note=chimes[Math.floor(Math.random()*chimes.length)];this._chime(t+delay,note,0.05+Math.random()*0.04);}
    this._breath(t+0.5,261.63,11);this._breath(t+5,392.00,9);
    this._chord(t,[65.41,82.41,98.00],15,0.025);
    const timer=setTimeout(()=>this._schedule(),12000+Math.random()*3000);this.timers.push(timer);
  }
  start(vol=0.72){this._init();if(this.ctx.state==='suspended')this.ctx.resume();this.playing=true;this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);this.masterGain.gain.linearRampToValueAtTime(vol,this.ctx.currentTime+1.5);this._schedule();}
  stop(){this.playing=false;this.timers.forEach(t=>clearTimeout(t));this.timers=[];if(this.masterGain){this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);this.masterGain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+1.8);}}
  setVolume(v){if(this.masterGain&&this.playing){this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);this.masterGain.gain.linearRampToValueAtTime(v,this.ctx.currentTime+0.3);}}
}

function MusicPlayer({isDark}){
  const [playing,setPlaying]=useState(false);
  const [volume,setVolume]=useState(0.72);
  const [notes]=useState(["🎵","🎶","🎼","✨","🌸"]);
  const [noteIdx,setNoteIdx]=useState(0);
  const audioRef=useRef(null);
  useEffect(()=>{if(!playing)return;const t=setInterval(()=>setNoteIdx(i=>(i+1)%notes.length),900);return()=>clearInterval(t);},[playing]);
  useEffect(()=>{if(audioRef.current)audioRef.current.volume=volume;},[volume]);
  const toggle=()=>{
    const a=audioRef.current;if(!a)return;
    if(playing){a.pause();setPlaying(false);}
    else{a.volume=volume;a.play().then(()=>setPlaying(true)).catch(err=>{console.error("Music failed to play:",err);alert("Couldn't play the music: "+err.message+"\n\nMake sure la_vie_en_rose.mp3 is in the same folder as this HTML file.");});}
  };
  const onVol=e=>{const v=parseFloat(e.target.value);setVolume(v);};
  return(
    <div className={`music-player${isDark?" dark":""}`}>
      <audio ref={audioRef} src="la_vie_en_rose.mp3" loop preload="none"/>
      <button className="music-play-btn" onClick={toggle} title={playing?"pause music":"play La Vie En Rose"}>
        {playing?"⏸":"▶"}
      </button>
      <div>
        <div className="music-label">
          {playing?<span><span className="music-note">{notes[noteIdx]}</span> La Vie En Rose</span>:"La Vie En Rose 🎹"}
        </div>
        {playing&&<input type="range" className="music-vol" min="0" max="1" step="0.05" value={volume} onChange={onVol}/>}
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("journal");
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("wj_user")||"null");}catch{return null;}});
  const [dataReady,setDataReady]=useState(false); // gates rendering until cloud data is pulled in for this user
  const [syncVersion,setSyncVersion]=useState(0); // bumped after each hydration to force sections to re-read fresh data
  const [toastMsg,setToastMsg]=useState("");
  const toastTimer=useRef(null);
  const showToast=useCallback(msg=>{setToastMsg(msg);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToastMsg(""),2400);},[]);

  // Pull this account's data down from Firestore and warm the local cache with it,
  // so every device shows the same journal/places/etc. instead of an empty local copy.
  const hydrate=useCallback((fbUser)=>{
    if(!fbUser||!fbUser.uid){
      currentUid=null;
      setDataReady(true);
      return;
    }
    currentUid=fbUser.uid;
    setDataReady(false);
    const loader=window.fbLoadAll?window.fbLoadAll(fbUser.uid):Promise.resolve({});
    loader.then(cloudData=>{
      Object.keys(cloudData||{}).forEach(key=>{
        try{localStorage.setItem(storageKey(fbUser.email,key),JSON.stringify(cloudData[key]));}catch(e){}
      });
      setDataReady(true);
      setSyncVersion(v=>v+1);
    });
  },[]);

  useEffect(()=>{
    const setupAuthListener=()=>{
      if(!window.fbOnAuthChanged)return;
      window.fbOnAuthChanged((fbUser)=>{
        if(fbUser){
          setUser(fbUser);
          localStorage.setItem("wj_user",JSON.stringify(fbUser));
          hydrate(fbUser);
        }else{
          setUser(null);
          localStorage.removeItem("wj_user");
          hydrate(null);
        }
      });
    };
    if(window.fbReady){setupAuthListener();}
    else{window.addEventListener("firebase-ready",setupAuthListener,{once:true});}
    const fallback=setTimeout(()=>{setDataReady(ready=>ready?ready:true);},6000);
    return ()=>clearTimeout(fallback);
  },[hydrate]);
  const signIn=()=>{
    if(!window.fbSignIn){showToast("sign-in not ready yet, try again in a sec 🌿");return;}
    window.fbSignIn()
      .then(u=>{setUser(u);localStorage.setItem("wj_user",JSON.stringify(u));hydrate(u);showToast("welcome, "+(u.name?u.name.split(" ")[0]:"friend")+" 🌸");})
      .catch(err=>{console.error("Firebase sign-in failed:",err);showToast("sign-in failed 😕");});
  };
  const signOut=()=>{
    if(window.fbSignOut){window.fbSignOut().catch(()=>{});}
    setUser(null);localStorage.removeItem("wj_user");currentUid=null;setDataReady(true);setSyncVersion(v=>v+1);showToast("signed out 🌿");
  };
  const BG=BACKGROUNDS[tab]||BACKGROUNDS.journal;
  const isMovies=tab==="movies";
  const userId=user?.email||"guest";
  return(
    <div style={{minHeight:"100vh",position:"relative",color:isMovies?"#f0e8d0":"inherit"}}>
      <BG/>
      {!user&&(
        <div className="signin-banner">
          <span>✦ sign in to save & sync your whimsical world across devices ✦</span>
          <button className="google-btn" onClick={signIn}>
            <svg className="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            sign in with Google
          </button>
        </div>
      )}
      <nav className="nav">
        <div className="nav-title">✦ Whimsy Journals ✦</div>
        {TABS.map(t=>(
          <button key={t.id} className={`nav-btn ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}
            style={isMovies&&tab!==t.id?{color:"rgba(240,228,200,0.65)"}:{}}>
            {t.label}
          </button>
        ))}
        <div className="nav-right">
          <a href="https://ko-fi.com/whimsyjournels" target="_blank" rel="noopener noreferrer" className="btn btn-ghost btn-sm" style={{fontFamily:"'Caveat',cursive",fontSize:15,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:4}}>
            ☕ buy me a coffee
          </a>
          {user
            ?<div className="user-chip">
                {user.picture?<img className="user-avatar" src={user.picture} alt={user.name}/>:<span style={{fontSize:16}}>🌸</span>}
                {user.name.split(" ")[0]}
                <button onClick={signOut} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"var(--soft)",marginLeft:2}}>✕</button>
              </div>
            :<button className="google-btn btn-sm" style={{fontSize:13,padding:"5px 12px"}} onClick={signIn}>
                <svg className="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                sign in
              </button>
          }
        </div>
      </nav>

      {tab==="journal"&&(
        <div className="hero">
          <SparkleTitle/>
          <div className="hero-divider"/>
          <div className="hero-sub">✦ a soulful space for art, wonder & all the soft things ✦</div>
        </div>
      )}
      {tab!=="journal"&&tab!=="wishlist"&&(
        <div style={{textAlign:"center",padding:"36px 24px 20px",position:"relative",zIndex:10}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:"clamp(28px,5vw,52px)",color:isMovies?"#d8a8e8":"var(--dark-brown)",letterSpacing:2,textShadow:isMovies?"0 2px 20px rgba(160,100,200,0.4)":"none"}}>
            {TABS.find(t=>t.id===tab)?.label}
          </div>
          <div style={{width:100,height:1,background:isMovies?"linear-gradient(90deg,transparent,#b888d8,transparent)":"linear-gradient(90deg,transparent,var(--antique-gold),transparent)",margin:"12px auto 0"}}/>
        </div>
      )}

      {tab==="journal"   &&dataReady&&<JournalSection key={`journal-${userId}-${syncVersion}`} user={userId} toast={showToast}/>}
      {tab==="places"    &&dataReady&&<PlacesSection  key={`places-${userId}-${syncVersion}`} user={userId} toast={showToast}/>}
      {tab==="movies"    &&dataReady&&<ListSection key={`movies-${userId}-${syncVersion}`} icon="🎬" title="Movies" noun="Movie" accentColor="#b87060" storeKey="movies" user={userId} toast={showToast}/>}
      {tab==="books"     &&dataReady&&<ListSection key={`books-${userId}-${syncVersion}`} icon="📚" title="Books"  noun="Book"  accentColor="#7a9c78" storeKey="books"  user={userId} toast={showToast}/>}
      {tab==="ideas"     &&dataReady&&<IdeasSection  key={`ideas-${userId}-${syncVersion}`} user={userId} toast={showToast}/>}
      {tab==="wishlist"  &&dataReady&&<WishlistSection key={`wishlist-${userId}-${syncVersion}`} user={userId} toast={showToast}/>}
      {!dataReady&&(
        <div style={{textAlign:"center",padding:"60px 20px",position:"relative",zIndex:10,fontFamily:"'Caveat',cursive",fontSize:22,color:"var(--soft)"}}>
          ✦ syncing your whimsical world... ✦
        </div>
      )}

      <Toast msg={toastMsg}/>
      <MusicPlayer isDark={isMovies}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
